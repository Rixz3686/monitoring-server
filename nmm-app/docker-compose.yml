services:
  backend:
    build: ./backend
    container_name: lgn-backend
    ports:
      - "3002:3002"
    volumes:
      # Mengikat folder data agar target monitoringmu tidak hilang saat restart
      - ./backend_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lgn-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped